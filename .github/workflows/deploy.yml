name: Deploy

# Auto-deploy static Worker to sudoku.djalmajr.dev on every push to main.
# Requires repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sudoku-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Smoke
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' https://sudoku.djalmajr.dev/)" || code=000
            echo "attempt $i → $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "smoke failed"
          exit 1
